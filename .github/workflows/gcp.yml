name: GCP

# Plan on a pull request so the change can be read; apply only from main, so
# nothing reaches the project that was not merged. The federation enforces the
# same split: only a run on main can act as the deployer.
on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/gcp/**"
      - ".github/workflows/gcp.yml"
  push:
    branches: [main]
    paths:
      - "deploy/gcp/**"
      - ".github/workflows/gcp.yml"

# Deny by default; each job asks for what it uses.
permissions: {}

env:
  TF_DIR: deploy/gcp/terraform
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Plan (lab)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Third-party actions are pinned to a commit, never to a tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform release
        id: release
        run: echo "version=$(cat "$TF_DIR/.terraform-version")" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLANNER_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.release.outputs.version }}
          terraform_wrapper: false

      - name: Format
        run: terraform -chdir="$TF_DIR" fmt -check -recursive

      - name: Init
        run: |
          terraform -chdir="$TF_DIR" init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config=lab/backend.hcl

      - name: Validate
        run: terraform -chdir="$TF_DIR" validate

      # -lock=false: the planner can read the state bucket but not write the
      # lock object. A plan changes nothing, so it does not need the lock.
      - name: Plan
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -lock=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var-file=lab/lab.tfvars

  apply:
    name: Apply (lab)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two merges in quick succession apply one after the other, never together.
    concurrency:
      group: gcp-lab-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform release
        id: release
        run: echo "version=$(cat "$TF_DIR/.terraform-version")" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.release.outputs.version }}
          terraform_wrapper: false

      - name: Init
        run: |
          terraform -chdir="$TF_DIR" init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config=lab/backend.hcl

      - name: Apply
        run: |
          terraform -chdir="$TF_DIR" apply -input=false -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var-file=lab/lab.tfvars
