name: Sensitive paths

# pull_request, never pull_request_target: PR code must not run with a privileged
# token. Fork PRs get a read-only token, so the guard only acts on same-repo PRs.
on:
  pull_request:
    types: [opened, synchronize, reopened, auto_merge_enabled]

permissions: {}

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # Never fails the PR: it is not a required check. It lists sensitive files
      # and removes auto-merge so that only the owner merges them.
      - name: Check changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTO_MERGE: ${{ github.event.pull_request.auto_merge != null }}
        run: |
          matches="$(gh pr diff "$PR_NUMBER" --name-only | (cd tools && GOWORK=off go run ./sensitivepaths ../.github/sensitive-paths.txt))" || true
          if [ -z "$matches" ]; then
            echo "No sensitive paths changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Sensitive paths changed (owner merges)"
            echo
            echo "$matches" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUTO_MERGE" = "true" ]; then
            gh pr merge --disable-auto "$PR_NUMBER" || true
            echo "Auto-merge disabled." >> "$GITHUB_STEP_SUMMARY"
          fi
