version: v2
# Deletes the output directories before generating, so a removed .proto leaves no
# stale generated file behind (proto-check would not see it otherwise).
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/aleogr/iam/api/gen/go
plugins:
  - local: ["env", "GOWORK=off", "go", "tool", "-modfile=tools/protoc-gen-go/go.mod", "protoc-gen-go"]
    out: api/gen/go
    opt: paths=source_relative
  - local: ["env", "GOWORK=off", "go", "tool", "-modfile=tools/protoc-gen-connect-go/go.mod", "protoc-gen-connect-go"]
    out: api/gen/go
    opt: paths=source_relative
