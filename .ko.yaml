# Base image pinned by digest (multi-arch index of cgr.dev/chainguard/static:latest):
# runs as non-root 65532, no shell. Refresh with `crane digest`.
defaultBaseImage: cgr.dev/chainguard/static@sha256:fc42af33e643f20d08baf03cddcc1c02ba57052dfb02edb0d79f3fc47bcea8d9
defaultPlatforms:
  - linux/amd64
  - linux/arm64
builds:
  - id: iam
    main: ./cmd/iam
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X main.version={{.Git.ShortCommit}}
