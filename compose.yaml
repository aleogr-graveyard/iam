# Local development environment: `make dev` / `make dev-down`.
# The password comes from .env.local (generated by scripts/dev-env.sh).
# The data volume keeps the password it was created with: if .env.local is
# lost or replaced, run `make dev-reset` to drop the volume and start over.
name: iam-dev

services:
  postgres:
    image: postgres:16@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: iam
      POSTGRES_DB: iam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-env.sh to create .env.local}
    volumes:
      - iam-dev-pgdata:/var/lib/postgresql/data
    # TCP probe: the unix socket is also open during the image's init-time server.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U iam -d iam"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  iam-dev-pgdata:
